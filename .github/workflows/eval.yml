name: RAG evaluation

on:
  push:
    branches: [main, week0-evaluation]
  pull_request:
  schedule:
    - cron: "0 2 * * *"      # nightly full tier, 02:00 UTC
  workflow_dispatch:

# Shared across both jobs. These pin the exact configuration the baseline
# numbers were measured under - an untagged run is not comparable to anything.
#   RERANK_ENABLED=false  FlashRank measurably degrades retrieval on this
#                         corpus (MRR 0.766 -> 0.399, n=39). See EVALUATION.md.
#   UTILITY_MODEL         llama-3.1-8b-instant was decommissioned by Groq in
#                         June 2026. Multi-Query and HyDE fail silently without
#                         this, because _safe() swallows the error.
env:
  RERANK_ENABLED: "false"
  UTILITY_MODEL: openai/gpt-oss-20b
  ANONYMIZED_TELEMETRY: "False"
  EVAL_SESSION_ID: eval-corpus-v1

jobs:
  fast:
    name: Fast tier (every push)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The BGE embedding model is ~130MB. Cache it or every run re-downloads.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/flashrank
          key: models-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Build eval collection
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m eval.setup_corpus

      - name: Fast tier
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: examforge-ci
        run: python -m pytest tests/test_retrieval_regression.py -m "not slow and not negative"

      - name: Negative test (proves the gate can fail)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: examforge-ci
        run: python -m pytest tests/test_retrieval_regression.py -m negative

  full:
    name: Full tier (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/flashrank
          key: models-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Build eval collection
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m eval.setup_corpus

      - name: Full tier
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: examforge-nightly
        run: python -m pytest tests/test_retrieval_regression.py -m "not negative"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/